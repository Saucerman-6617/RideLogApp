org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# KSP 仍通过 kotlin.sourceSets 注册生成目录，AGP 9 内置 Kotlin 需关闭该校验
android.disallowKotlinSourceSets=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# 如需固定本地 JDK，请在自己的 ~/.gradle/gradle.properties 中配置：
# org.gradle.java.home=/path/to/jdk
# 不要写进项目，避免路径泄漏到其他机器。

# 禁用 Gradle 9.x 的 Daemon JVM 自动更新（避免触发 updateDaemonJvm 任务报 toolchain 仓库错）
org.gradle.daemon.jvm.download.enabled=false
